name: Publish HACS release
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
permissions:
  contents: write
jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Read integration version
        id: version
        run: |
          echo "version=$(python -c 'import json; print(json.load(open("custom_components/beneylu/manifest.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" --title "Beneylu School $TAG" --notes "v0.3.0 : réponses aux mots, médias (métadonnées sans URL signée), applications disponibles, permissions, interactions et compatibilité améliorée avec les endpoints observés. Données de tests entièrement fictives."
